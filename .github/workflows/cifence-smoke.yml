name: CIFence Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cifence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oaslananka/cifence@v0.1.1
        with:
          mode: warn
          sarif: "true"
          upload-sarif: "false"

      - name: Verify CIFence reports
        shell: bash
        run: |
          set -euo pipefail
          test -s cifence-results/cifence.json
          test -s cifence-results/cifence.sarif
