name: CIFence Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cifence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: false

      - uses: oaslananka/cifence@v0.1.0
        with:
          mode: warn
          sarif: "true"
          upload-sarif: "false"
